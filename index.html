<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizMaster</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="quiz_header">
      <h1>
        <span class="greenLetter">Q</span>uiz<span class="greenLetter"
          >Master</span
        >
      </h1>
    </header>
    <main>
      <article>
        <section class="main_text">
          <span><p>Bienvenido al juego definitivo de trivia</p></span>
          <h2>Pon a prueba tu conocimiento con Quizmaster</h2>
          <span><p>¡Demuestra tu sabiduría!</p></span>
        </section>
        <section class="main_name">
          <label for="nickname"></label>
          <input
            type="text"
            name="nickname"
            id="nickname"
            placeholder="Introduce tu nombre..."
          />
          <button>Empezar Quiz</button>
        </section>
      </article>
    </main>
  </body>
</html>
