<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizMaster</title>
    <link rel="stylesheet" href="../css/game.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <nav>
      <a class="brand-link" href="index.html"><span class="verde">Q</span>uiz<span class="verde">Master</span></a>
      <div class="nav-player-round">
        <div>Jugador: <span class="verde" id="player-name"></span></div>
        <div>Ronda <span class="verde" id="round-number">1</span> de 2</div>
      </div>
    </nav>
    <main id="quiz" aria-live="polite">
      <p id="loading-message">Cargando preguntas…</p>
    </main>
    <dialog id="result-dialog" aria-labelledby="result-title">
      <h2 id="result-title"></h2>
      <p id="result-message"></p>
      <button class="green_bubble" id="result-action" type="button"></button>
    </dialog>
    <script src="../js/script.js"></script>
  </body>
</html>
